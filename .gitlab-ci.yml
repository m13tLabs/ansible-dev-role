include:
  - project: 'm13t/ci'
    ref: 'main'
    file: '.gitlab-ci/jobs/ansible-role.yml'

# TODO: Move to template
.ansible_molecule_test:
  tags:
    - shell
  before_script:
    - docker info
    - python3 --version
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install ansible molecule-plugins[docker]
  script:
    - source .venv/bin/activate
    - cat $GITLAB_GIT_SETUP | bash
    - |
      WORKING_DIR=$(pwd)
      [ -f molecule/default/requirements.txt ] && pip install -r molecule/default/requirements.txt
      # Collections required by the molecule docker driver itself.
      ansible-galaxy collection install community.docker ansible.posix
      # This role's own runtime dependencies (mare.nvm role, community.general collection).
      [ -f requirements.yml ] && ansible-galaxy role install -r requirements.yml
      [ -f requirements.yml ] && ansible-galaxy collection install -r requirements.yml
      chmod -R 744 ${WORKING_DIR}
      molecule test
  after_script:
    - rm -rf .venv

Molecule test:
  stage: test
  extends:
    - .ansible_molecule_test
  rules:
    - exists:
        - molecule/default/molecule.yml
  artifacts:
    reports:
      junit: molecule/default/reports/*.xml
