---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: debian-dev
    image: debian:bullseye
    pre_build_image: true
    privileged: false
    command: "/bin/sh -c 'while true; do sleep 3600; done'"
provisioner:
  name: ansible
  env:
    # Include this project's own parent dir (so the role under test resolves
    # by its checkout directory name) alongside the default galaxy roles dir
    # (so the mare.nvm dependency installed via `requirements.yml` resolves).
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/..:~/.ansible/roles"
    ANSIBLE_CALLBACKS_ENABLED: "junit"
    JUNIT_OUTPUT_DIR: "${MOLECULE_SCENARIO_DIRECTORY}/reports"
    JUNIT_TASK_CLASS: "yes"
    JUNIT_FAIL_ON_CHANGE: "no"
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - side_effect
    - verify
    - cleanup
    - destroy
